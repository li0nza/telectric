name: telectric
description: "EV Charging Station Map"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: any
  geolocator: ^14.0.0
  flutter_bloc: ^9.1.0
  dio: ^5.8.0
  retrofit: ^4.4.2
  flutter_map_location_marker: ^10.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: ^4.3.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  freezed: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/logo.png"
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
